name: Release GoW Overlay

# Publica o executável na aba Releases quando uma tag de versão é enviada
# (ex.: git tag v1.03 && git push origin v1.03).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build executable
        shell: powershell
        run: .\build.ps1

      - name: Prepare release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\GoW Overlay.exe" "release\GoW-Overlay.exe"
          $hash = (Get-FileHash "release\GoW-Overlay.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  GoW-Overlay.exe" | Out-File -Encoding ascii "release\GoW-Overlay.exe.sha256"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
